<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Get the TOOQ app</title>
    <meta name="description" content="Download TOOQ for iPhone or Android." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#FFF6EE" />
    <link rel="icon" type="image/png" href="../assets/app_icon.png" />
    <link rel="apple-touch-icon" href="../assets/app_icon.png" />

    <script>
      // QR code landing page: send each phone to its own store, everyone else to the home page.
      (function () {
        var IOS_URL = "https://apps.apple.com/app/id6792516587";
        var ANDROID_URL = "https://play.google.com/store/apps/details?id=com.tooqapp.com";
        var HOME_URL = "/";

        var ua = navigator.userAgent || "";
        // iPadOS 13+ reports itself as a Mac; a Mac with a touch screen is an iPad.
        var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
        var isAndroid = /Android/i.test(ua);

        // replace() keeps this page out of history, so "back" from the store does not bounce here again.
        location.replace(isIOS ? IOS_URL : isAndroid ? ANDROID_URL : HOME_URL);
      })();
    </script>

    <link rel="stylesheet" href="../assets/site.css" />
    <style>
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--g-splash);
        text-align: center;
        padding: 24px 16px;
      }
      .logo {
        height: 56px;
        width: auto;
        margin: 0 auto 20px;
      }
      .links {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 320px;
        margin: 24px auto 0;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="../assets/logo.svg" alt="TOOQ" />
      <p class="lead">Taking you to the TOOQ app…</p>
      <!-- Shown only if the redirect does not happen (JavaScript off, or a slow store). -->
      <div class="links">
        <a class="btn btn-primary" href="https://apps.apple.com/app/id6792516587" rel="noopener">Download on the App Store</a>
        <a class="btn btn-ghost" href="https://play.google.com/store/apps/details?id=com.tooqapp.com" rel="noopener">Get it on Google Play</a>
        <a class="supporting" href="../">Go to tooq.ai</a>
      </div>
    </main>
  </body>
</html>
